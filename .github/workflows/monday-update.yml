name: 品牌库周更新

on:
  schedule:
    # 北京时间每周一早上 6:07（UTC 周日 22:07）
    - cron: '7 22 * * 0'
  workflow_dispatch:

jobs:
  monday-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行品牌库更新
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          python scheduler/daily_job.py --date $(date +%Y-%m-%d) --monday-update
